services:
  # Backend API Web Service
  - type: web
    name: voice-insight-iq-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "True"
      - key: DATABASE_URL
        value: sqlite:///./voice_insight_iq.db
      - key: SUPABASE_URL
        value: https://zyjsolotnqhawtbqgccz.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_k7xeCrIFhkI7_G-Y0iWazw_65Wx1Dzn
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_k7xeCrIFhkI7_G-Y0iWazw_65Wx1Dzn
      - key: SERPAPI_API_KEY
        value: 9e064ab04ce28bae119d8ee27a46b345b1368937fd1de9d6757737936a312858
      - key: DATAFORSEO_LOGIN
        value: monikamail2006@gmail.com
      - key: DATAFORSEO_PASSWORD
        value: 00619e3e6946ee29

  # Frontend React Static Site
  - type: web
    name: voice-insight-iq-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://zyjsolotnqhawtbqgccz.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_k7xeCrIFhkI7_G-Y0iWazw_65Wx1Dzn
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_k7xeCrIFhkI7_G-Y0iWazw_65Wx1Dzn
