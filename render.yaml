services:
  # Backend API Web Service
  - type: web
    name: voice-insight-iq-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "True"
      - key: DATABASE_URL
        value: sqlite:///./voice_insight_iq.db
      - key: SUPABASE_URL
        value: https://zyjsolotnqhawtbqgccz.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false

  # Frontend React Static Site
  - type: web
    name: voice-insight-iq-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        value: https://zyjsolotnqhawtbqgccz.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
